format_version: 4
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  # An example secret param, define it (A_SECRET_PARAM) in .bitrise.secrets.yml
  - A_SECRET_PARAM: $A_SECRET_PARAM
  # If you want to share this step into a StepLib
  - BITRISE_STEP_ID: bitrise-ticket-extractor
  - BITRISE_STEP_VERSION: "0.0.1"
  - BITRISE_STEP_GIT_CLONE_URL: https://github.com/Freebox-Apps/bitrise-step-bitrise-ticket-extractor.git
  - MY_STEPLIB_REPO_FORK_GIT_URL: $MY_STEPLIB_REPO_FORK_GIT_URL

workflows:
  test:
    steps:
    - change-workdir:
        title: Switch working dir to your Git repository
        inputs:
        - is_create_path: false
        - path: /Users/tfighiera/Project/MonCompteApp
    - path::./:
        run_if: true
        inputs:
        - example_step_input: Example Step Input's value
        - start_commit: f6b4c9780b538c581aea1341b698d663d83cc6bd
    - script:
        inputs:
        - content: |
            #!/bin/bash
            echo "$TICKET_LIST"
        title: Test Outputs

