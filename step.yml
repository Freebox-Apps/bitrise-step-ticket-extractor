title: |-
  bitrise-ticket-extractor
summary: |
  Extract tickets references
description: |
   This step allow to extract all ticket references contained in a range of commits
website: https://github.com/Freebox-Apps/bitrise-step-bitrise-ticket-extractor
source_code_url: https://github.com/Freebox-Apps/bitrise-step-bitrise-ticket-extractor
support_url: https://github.com/Freebox-Apps/bitrise-step-bitrise-ticket-extractor/issues

type_tags:
  - utility

toolkit:
  go:
    package_name: github.com/Freebox-Apps/bitrise-step-bitrise-ticket-extractor


inputs:
  - repo_dir: "."
    opts:
      title: Git repository local directory
      is_required: true
  - start_commit: ""
    opts:
      title: The oldest commit from where to start changelog generation
      is_required: true
  - end_commit: "HEAD"
    opts:
      title: The earliest commit to stop changelog generation
      is_required: false
  - output_delimiter: "|"
    opts:
      title: Ticket output_delimiter
      description:  Delimiter to use when several tickets are found e.g. with `|` will ouptut TK-123|TK-124

outputs:
  - TICKET_LIST:
    opts:
      title: The resolved ticket list
      description: |
        All tickets found will be retrived and concatenate into a string delimited
